    - list [ref=e68]:
      - listitem [ref=e69]: PM keeps the acceptance checklist and decides whether the demo proves the promise.
      - listitem [ref=e70]: Development owns compiler, router, runtime, and demo integration.
      - listitem [ref=e71]: Research checks the theory against prior art and keeps naming or platform drift from leaking in.
      - listitem [ref=e72]: Testing owns route, include, asset, and browser smoke evidence.
      - listitem [ref=e73]: Review inspects the final diff and blocks sloppy completion.
    - paragraph [ref=e74]: The standing team size is 4 to 6. If work expands, add a design or architecture lane; if work shrinks, keep PM, development, testing, and review active.