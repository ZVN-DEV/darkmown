name: Release

# The one workflow that can reach the registry. npm trusted publishing (OIDC)
# names a single workflow file per package, so stable releases and canaries both
# live here. There is no npm token to expire: if a publish fails with E404, check
# the Trusted Publisher settings on npmjs.com first.
#
#   - A `v*` tag publishes that version to `latest` (the verify/publish jobs).
#   - A push to master publishes a prerelease to `next` (the canary-* jobs).
on:
  push:
    tags: ["v*"]
    branches: [master]

concurrency:
  # Serialise, do NOT cancel. Two merges landing seconds apart must not both be
  # inside `npm publish` at once, and killing a run mid-publish is worse than
  # letting it finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ZVN-DEV/darkmown' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Zero-dep node:test coverage; matches the CI line coverage gate.
      - run: npm run test:cov
      # The shipped runtime is a committed esbuild artifact (src/runtime.min.js).
      # Publishing a stale one would ship a runtime that is not this source.
      - run: node scripts/build-runtime.mjs --check
      - run: npm run build
      - run: npm run runtime:size
      - run: npm audit --audit-level=high

  publish:
    needs: verify
    if: github.repository == 'ZVN-DEV/darkmown' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 carries an npm new enough for trusted publishing (11.5.1+).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `--project=chromium` is REQUIRED, not an optimisation: playwright.config
      # now declares chromium + firefox + webkit, so a bare `npm run test:e2e`
      # here would try to launch two engines this job never installed and fail
      # the release. The three-engine matrix is CI's job (.github/workflows/ci.yml)
      # and it has already run against this exact commit on the way to the tag;
      # the release gate keeps one engine so tagging stays fast.
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:extension

      # Supply-chain guard: prove the PUBLISHED TARBALL actually works before we
      # publish it. `npm pack` honours the `files` allowlist, so this catches
      # missing-file / bad-glob regressions that unit tests can't see — install
      # the exact bytes that would ship, scaffold a project against them, build,
      # and assert the build produced HTML.
      - name: Pack and smoke-test the tarball
        shell: bash
        run: |
          set -euo pipefail

          # Build the tarball exactly as `npm publish` would and capture its name.
          TARBALL="$(npm pack --silent)"
          TARBALL_ABS="$PWD/$TARBALL"
          echo "Packed tarball: $TARBALL_ABS"

          # Fresh, empty workspace outside the repo so nothing leaks in.
          WORK="$(mktemp -d)"
          cd "$WORK"

          # Scaffold a new project using the packed CLI (npm exec installs the
          # tarball into a temp prefix and runs its `darkmown` bin — no registry).
          npm exec --yes --package="$TARBALL_ABS" -- darkmown init demo
          cd demo

          # Install the local tarball into the scaffolded project (the scaffold
          # pins a registry version that does not exist until we actually publish),
          # so the build runs against the exact bytes we are about to publish.
          npm install --no-audit --no-fund "$TARBALL_ABS"

          # Build via the project's own installed bin and assert the canonical
          # output exists and is non-empty.
          npx --no-install darkmown build

          test -s dist/index.html || { echo "::error::pack smoke-test failed: dist/index.html missing or empty"; exit 1; }
          echo "Pack smoke-test passed: dist/index.html built from the published tarball."

      # Authenticates with OIDC, which also attaches provenance.
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  canary-verify:
    name: Verify (canary gates)
    runs-on: ubuntu-latest
    # A fork that syncs master would otherwise run this in its own Actions and
    # attempt to publish our package name. It would fail at the registry, but
    # "fails at the last step" is not a safety property. Refuse before any work.
    if: github.repository == 'ZVN-DEV/darkmown' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same gates the stable release runs, in the same order, so a
      # canary is never held to a lower standard than a tag. Single-Node here
      # rather than the tag path's 20/22/24 matrix: ci.yml is running that full
      # matrix (plus Windows, macOS, and three browser engines) against this
      # exact commit in parallel. This job exists to make the gates BLOCKING for
      # the publish below, not to re-derive what CI already knows.
      - run: npm run typecheck
      - run: npm run test:cov
      # The shipped runtime is a committed esbuild artifact (src/runtime.min.js).
      # Publishing a stale one would ship a runtime that is not this source.
      - run: node scripts/build-runtime.mjs --check
      - run: npm run build
      - run: npm run runtime:size
      - run: npm audit --audit-level=high

  canary-publish:
    name: Publish to the next channel
    needs: canary-verify
    runs-on: ubuntu-latest
    # Repeated deliberately. `needs: canary-verify` already inherits the skip, but this
    # is the job that can reach the registry, so it states its own conditions.
    if: github.repository == 'ZVN-DEV/darkmown' && github.ref == 'refs/heads/master'
    permissions:
      # Never `write`. A canary must not push, tag, or cut a GitHub release —
      # that is the tag path's job and it is the reason this token is read-only.
      contents: read
      # Required for trusted publishing and `--provenance`.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 carries an npm new enough for trusted publishing (11.5.1+).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci

      # Ephemeral prerelease version, derived from the CURRENT package.json
      # version with the patch bumped: a canary then sorts ABOVE the last stable
      # release and BELOW the next one, which is what it actually represents.
      # Two identifiers follow, and they are both load-bearing:
      #   - run_number: monotonically increasing, so canaries order correctly
      #   - short SHA:  makes the version unique and traceable to a commit
      # The SHA is `g`-prefixed (git-describe style) on purpose. A bare all-digit
      # short SHA with a leading zero would be an invalid semver numeric
      # identifier and npm would reject the version.
      - name: Compute canary version
        id: canary
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'const v = require("./package.json").version.split("-")[0].split(".").map(Number); v[2] += 1; v.join(".") + "-next." + process.env.RUN + ".g" + process.env.SHA.slice(0, 7)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Canary version: $VERSION"

      # Fail closed. If the computed string is not a prerelease, something above
      # is wrong and publishing it would put a stable-looking version on the
      # registry. Refuse rather than guess.
      - name: Assert the version is a prerelease
        env:
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-next.*) echo "OK: $VERSION carries a -next. prerelease identifier" ;;
            *) echo "::error::refusing to publish '$VERSION': a canary must be a prerelease"; exit 1 ;;
          esac

      # Writes package.json (and the lockfile) on the runner only.
      # `--no-git-tag-version` means npm touches no git state whatsoever: no
      # commit, no tag. Nothing later in this job pushes, so the bump dies with
      # the runner, which is exactly what "ephemeral" has to mean.
      - name: Apply the canary version (runner only, never committed)
        run: npm version --no-git-tag-version "${{ steps.canary.outputs.version }}"

      # `npm publish` runs `prepublishOnly` -> `prepublish:check`, which packs
      # the tarball and smoke-tests it in a temp project via `npm run smoke`, so
      # the published bytes are exercised here the same way the tag path exercises
      # them with its explicit pack step. The canary is not the weaker gate.
      #
      # Do not remove `--tag next`, and do not "simplify" it away: npm applies
      # `latest` by default, to prereleases included, so without it npm would
      # move `latest` to this prerelease.
      - name: Publish to the next channel
        run: npm publish --provenance --access public --tag next

      # Post-condition, not decoration: prove `latest` still points somewhere
      # else. Deliberately fail-OPEN on a lookup error (the registry needs a
      # moment to propagate a fresh publish, and a read timeout must not turn a
      # good publish red) and fail-CLOSED on the one answer that matters.
      - name: Assert the latest dist-tag did not move
        env:
          VERSION: ${{ steps.canary.outputs.version }}
          # setup-node's .npmrc sends a placeholder token, which the registry
          # rejects outright. This package is public, so read it with no .npmrc
          # at all and get a real answer instead of the fail-open branch.
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          set -euo pipefail
          LATEST="$(npm view @zvndev/darkmown dist-tags.latest 2>/dev/null || true)"
          if [ -z "$LATEST" ]; then
            echo "::warning::could not read the latest dist-tag (registry propagation); skipping the check"
            exit 0
          fi
          echo "latest=$LATEST  published=$VERSION"
          if [ "$LATEST" = "$VERSION" ]; then
            echo "::error::the canary $VERSION became the 'latest' dist-tag — the --tag next flag is missing or was ignored"
            exit 1
          fi
          echo "OK: latest is still $LATEST"

      - name: Summary
        env:
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          {
            echo "### Canary published"
            echo
            echo '```'
            echo "npm install @zvndev/darkmown@next   # $VERSION"
            echo '```'
            echo
            echo "The \`latest\` dist-tag was not touched. Stable releases still come only from a \`v*\` tag."
          } >> "$GITHUB_STEP_SUMMARY"
