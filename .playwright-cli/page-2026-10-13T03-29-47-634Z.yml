      - heading "Your First Visit" [level=2] [ref=e34]
      - paragraph [ref=e35]: Welcome to ToothDocs! Your first appointment is all about getting to know you. We'll review your health history, perform a thorough exam, and talk through your goals and any concerns; no pressure, no surprises.
      - paragraph [ref=e36]: Please arrive a few minutes early to complete your new-patient paperwork, or fill it out online ahead of time to save a step.
      - heading "Payment & Financing" [level=2] [ref=e37]
      - paragraph [ref=e38]: We accept most major PPO insurance plans, as well as cash, check, and major credit cards. If your insurance doesn't cover everything, we'll work with you to find a payment solution, including CareCredit financing, so cost is never a barrier to the care you need.
      - heading "Membership Plan" [level=2] [ref=e39]
      - paragraph [ref=e40]: No insurance? Our in-house membership plan covers your routine preventive care and offers savings on additional treatment for a low yearly or monthly fee.
      - heading "Questions?" [level=2] [ref=e41]
      - paragraph [ref=e42]: Call us any time; our team is happy to help you prepare for your visit.
